{% extends "base.html" %}
{% block title %}Log in — BlueGriva{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-8 py-16">
  <h1 class="font-display text-2xl text-ink">Log in with your phone</h1>
  {% if error %}<p class="mt-2 text-sm text-red-600">{{ error }}</p>{% endif %}
  <form method="post" class="mt-10 space-y-4">
    {% csrf_token %}
    <div>
      <label class="text-sm text-ink-muted">Phone number</label>
      <input name="phone" required class="my-1 w-full rounded-lg border border-border px-3 py-2">
    </div>
    <button type="submit" class="w-full rounded-full bg-brand px-6 py-3 font-medium text-white">
      Send OTP
    </button>
  </form>
</section>
{% endblock %}
