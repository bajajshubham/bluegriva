{% extends "base.html" %}
{% block title %}Verify OTP — BlueGriva{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-8 py-16">
  <h1 class="font-display text-2xl text-ink">Enter the code</h1>
  <p class="mt-1 text-sm text-ink-muted">Sent to {{ phone }}. Dev mode prints it to your terminal instead of sending a real SMS.</p>
  {% if error %}<p class="mt-2 text-sm text-red-600">{{ error }}</p>{% endif %}
  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    <input type="hidden" name="phone" value="{{ phone }}">
    <div>
      <label class="text-sm text-ink-muted">6-digit code</label>
      <input name="code" required maxlength="6" class="my-1 w-full rounded-lg border border-border px-3 py-2 tracking-widest">
    </div>
    <button type="submit" class="w-full rounded-full bg-brand px-6 py-3 font-medium text-white">
      Verify & log in
    </button>
  </form>
</section>
{% endblock %}
