<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BlueGriva{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:wght@400;600&display=swap"
    rel="stylesheet">

  {% load tailwind_tags %}
  {% tailwind_css %}

  <!-- HTMX: server-driven partial page updates -->
  <script src="https://unpkg.com/htmx.org@2.0.10" defer></script>
  <!-- Alpine.js: small client-side interactivity (dropdowns, toggles) -->
  <script src="https://unpkg.com/alpinejs@3.15.12/dist/cdn.min.js" defer></script>
</head>

<body class="font-sans bg-surface text-ink" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block content %}
  BASE
  {% endblock %}
</body>

</html>
