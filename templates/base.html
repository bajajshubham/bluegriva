<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BlueGriva{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">

  {% load tailwind_tags %}
  {% tailwind_css %}

  <script src="https://unpkg.com/htmx.org@2.0.10" defer></script>
  <script src="https://unpkg.com/alpinejs@3.15.12/dist/cdn.min.js" defer></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="h-full font-sans bg-surface text-ink" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' x-data="{ cartOpen: false }">

  {% include "partials/_header.html" %}

  {% block content %}{% endblock %}

  {% include "partials/_footer.html" %}

  <!-- Cart drawer -->
  <div x-show="cartOpen" x-cloak class="fixed inset-0 z-40 bg-black/40" @click.self="cartOpen = false">
    <div class="fixed right-0 top-0 flex h-full w-full max-w-sm flex-col bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-border p-4">
        <h2 class="font-display text-lg text-ink">Your cart</h2>
        <button @click="cartOpen = false" class="text-xl text-ink-muted">&times;</button>
      </div>
      <div class="flex-1 overflow-y-auto p-4">
        {% include "cart_orders/_cart_summary.html" %}
      </div>
    </div>
  </div>
</body>
</html>
