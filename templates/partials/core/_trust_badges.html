{% load icons %}
<section class="border-y border-border bg-brand-wash/40">
  <div class="mx-auto grid max-w-7xl grid-cols-2 gap-6 px-8 py-6 sm:grid-cols-4">
    {% for badge in trust_badges %}
      <div class="flex items-center gap-3">
        <span class="flex size-10 shrink-0 items-center justify-center rounded-full bg-brand-light">
          {% icon badge.icon "size-5 text-brand" %}
        </span>
        <span>
          <span class="block text-sm font-bold text-ink">{{ badge.title }}</span>
          <span class="block text-xs text-ink-muted">{{ badge.subtitle }}</span>
        </span>
      </div>
    {% endfor %}
  </div>
</section>
