<div id="cart-panel">
  {% for item in items %}
    <div class="flex items-center justify-between border-b border-ink/10 py-3">
      <div>
        <p class="text-sm text-ink">{{ item.product.name }}</p>
        <p class="text-xs text-ink-muted">{{ item.product.weight_label }} × {{ item.quantity }}</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-sm text-ink">₹{{ item.line_total }}</span>
        <button
          hx-post="{% url 'cart_orders:cart_remove' item.product.id %}"
          hx-target="#cart-panel" hx-swap="outerHTML"
          class="text-xs text-ink-muted underline">Remove</button>
      </div>
    </div>
  {% empty %}
    <p class="text-sm text-ink-muted">Your cart is empty.</p>
  {% endfor %}

  {% if items %}
    <div class="mt-4 flex justify-between border-t border-ink/10 pt-4 font-medium text-ink">
      <span>Total</span>
      <span>₹{{ total }}</span>
    </div>
  {% endif %}
</div>
